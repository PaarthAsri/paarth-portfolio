<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="128" height="128" class="bug" role="img" aria-label="Bug" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bug{--t:.5s}
    .bug-leg{animation:bug-step var(--t) ease-in-out infinite}
    .bug-leg.l{--d:1}
    .bug-leg.r{--d:-1}
    .bug-leg.b{animation-delay:calc(var(--t) * -0.5)}
    @keyframes bug-step{
      0%,100%{transform:rotate(calc(var(--d) * -13deg))}
      50%{transform:rotate(calc(var(--d) * 13deg))}
    }
    /* add class "is-idle" on the svg to stop walking (neutral pose) */
    .bug.is-idle .bug-leg{animation:none}
    @media (prefers-reduced-motion:reduce){.bug-leg{animation:none}}
  </style>
  <g fill="none" stroke="currentColor" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- legs: each is drawn from its root at the body edge, so it swings from the body -->
    <g transform="translate(110 208)"><path class="bug-leg l a" d="M0 0Q-70 -3 -70 -68V-93"/></g>
    <g transform="translate(404 208)"><path class="bug-leg r b" d="M0 0Q70 -3 70 -68V-93"/></g>
    <g transform="translate(110 272)"><path class="bug-leg l b" d="M0 0H-96"/></g>
    <g transform="translate(404 272)"><path class="bug-leg r a" d="M0 0H96"/></g>
    <g transform="translate(110 335)"><path class="bug-leg l a" d="M0 0Q-70 5 -70 70V105"/></g>
    <g transform="translate(404 335)"><path class="bug-leg r b" d="M0 0Q70 5 70 70V105"/></g>
    <!-- antennae -->
    <path d="M198 20L224 58" stroke-width="24"/>
    <path d="M316 20L290 58" stroke-width="24"/>
  </g>
  <g fill="currentColor">
    <path d="M143 132V108Q143 45 205 45H310Q372 45 372 108V132Z"/>
    <path d="M128 160H246V337A11 11 0 0 0 268 337V160H386Q408 160 408 182V350A151 151 0 0 1 106 350V182Q106 160 128 160Z"/>
  </g>
</svg>
